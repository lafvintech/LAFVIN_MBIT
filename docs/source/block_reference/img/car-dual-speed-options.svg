<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Car control block with separate left and right motor speeds</title>
  <desc id="description">The purple Car_Ctrl block shows the Forward direction menu, Lmotor 100, and Rmotor 100. The direction menu lists all seven choices.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1b125a" flood-opacity=".22"/></filter>
    <style>.block{font:700 31px Consolas,monospace;fill:#fff}.menu{font:700 30px Consolas,monospace;fill:#fff}.num{font:700 27px Consolas,monospace;fill:#58677d}</style>
  </defs>
  <rect width="1200" height="820" fill="#fff"/>
  <path d="M40 34h1120c10 0 18 8 18 18v94c0 10-8 18-18 18H168c-10 0-17 6-24 14l-17 20c-8 9-22 9-30 0l-17-20c-7-8-14-14-24-14H40c-10 0-18-8-18-18V52c0-10 8-18 18-18z" fill="#2908df"/>
  <text x="54" y="114" class="block">Car_Ctrl</text>
  <rect x="256" y="54" width="210" height="88" rx="15" fill="#2908df" stroke="#fff" stroke-width="4"/>
  <text x="279" y="111" class="block">Forward</text><path d="M423 84h17l-8.5 10z" fill="#fff"/>
  <text x="491" y="114" class="block">Lmotor</text><rect x="635" y="59" width="98" height="76" rx="36" fill="#fff" stroke="#d1d7dd" stroke-width="3"/><text x="651" y="109" class="num">100</text>
  <text x="753" y="114" class="block">Rmotor</text><rect x="897" y="59" width="98" height="76" rx="36" fill="#fff" stroke="#d1d7dd" stroke-width="3"/><text x="913" y="109" class="num">100</text>
  <g filter="url(#shadow)"><rect x="330" y="196" width="314" height="518" rx="4" fill="#b7b0f0"/><rect x="330" y="196" width="314" height="74" fill="#a79fe7"/></g>
  <text x="359" y="244" class="menu">✓</text><text x="411" y="244" class="menu">Forward</text>
  <text x="411" y="315" class="menu">Backward</text><text x="411" y="386" class="menu">Left</text><text x="411" y="457" class="menu">Right</text><text x="411" y="528" class="menu">Stop</text><text x="411" y="599" class="menu">Rotate Left</text><text x="411" y="670" class="menu">Rotate Right</text>
</svg>
