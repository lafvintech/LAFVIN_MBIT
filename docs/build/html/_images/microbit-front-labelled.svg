<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">The front of a micro:bit V2 with four useful parts labelled</title>
  <desc id="description">A simple diagram labels button A, the LED display and light sensor, button B, and the edge connector used to connect the micro:bit to the car.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity=".16"/>
    </filter>
    <style>
      .label-title { font: 700 24px Arial, sans-serif; fill: #17324d; }
      .label-copy { font: 18px Arial, sans-serif; fill: #425466; }
      .board-copy { font: 700 24px Arial, sans-serif; fill: #f4f7fa; letter-spacing: 1px; }
      .pin-copy { font: 700 16px Arial, sans-serif; fill: #181b20; }
      .leader { fill: none; stroke: #2f8bc1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #2f8bc1; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f7fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Front</text>
  <text x="600" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#68788a">micro:bit V2 shown</text>

  <g filter="url(#shadow)">
    <rect x="280" y="110" width="640" height="440" rx="28" fill="#14171c"/>
  </g>

  <!-- Subtle printed circuit pattern -->
  <g opacity=".24" fill="none" stroke="#8091a2" stroke-width="2">
    <path d="M320 155h92v35h55M880 165h-80v32h-52M315 475h96v-38h65M885 470h-92v-35h-56"/>
    <circle cx="335" cy="180" r="5"/><circle cx="865" cy="190" r="5"/>
    <circle cx="348" cy="450" r="5"/><circle cx="850" cy="452" r="5"/>
  </g>

  <!-- Logo and microphone detail, shown for orientation only -->
  <path d="M584 151c9-15 23-15 32 0 9-15 23-15 32 0-2 20-17 35-32 44-15-9-30-24-32-44z" fill="#d6aa42"/>
  <circle cx="684" cy="175" r="5" fill="#d6aa42"/>

  <!-- Buttons -->
  <g>
    <rect x="356" y="274" width="74" height="74" rx="12" fill="#eef2f5" stroke="#aab5bf" stroke-width="5"/>
    <circle cx="393" cy="311" r="18" fill="#cfd8df"/>
    <text x="393" y="384" text-anchor="middle" class="board-copy">A</text>
    <rect x="770" y="274" width="74" height="74" rx="12" fill="#eef2f5" stroke="#aab5bf" stroke-width="5"/>
    <circle cx="807" cy="311" r="18" fill="#cfd8df"/>
    <text x="807" y="384" text-anchor="middle" class="board-copy">B</text>
  </g>

  <!-- 5 by 5 LED display -->
  <g fill="#ec4055">
    <circle cx="520" cy="248" r="10"/><circle cx="560" cy="248" r="10"/><circle cx="600" cy="248" r="10"/><circle cx="640" cy="248" r="10"/><circle cx="680" cy="248" r="10"/>
    <circle cx="520" cy="288" r="10"/><circle cx="560" cy="288" r="10"/><circle cx="600" cy="288" r="10"/><circle cx="640" cy="288" r="10"/><circle cx="680" cy="288" r="10"/>
    <circle cx="520" cy="328" r="10"/><circle cx="560" cy="328" r="10"/><circle cx="600" cy="328" r="10"/><circle cx="640" cy="328" r="10"/><circle cx="680" cy="328" r="10"/>
    <circle cx="520" cy="368" r="10"/><circle cx="560" cy="368" r="10"/><circle cx="600" cy="368" r="10"/><circle cx="640" cy="368" r="10"/><circle cx="680" cy="368" r="10"/>
    <circle cx="520" cy="408" r="10"/><circle cx="560" cy="408" r="10"/><circle cx="600" cy="408" r="10"/><circle cx="640" cy="408" r="10"/><circle cx="680" cy="408" r="10"/>
  </g>

  <!-- Gold edge connector -->
  <g>
    <rect x="300" y="478" width="600" height="72" fill="#d6aa42"/>
    <g fill="#f3d77b">
      <rect x="314" y="478" width="13" height="72"/><rect x="341" y="478" width="13" height="72"/>
      <rect x="368" y="478" width="13" height="72"/><rect x="395" y="478" width="13" height="72"/>
      <rect x="422" y="478" width="13" height="72"/><rect x="449" y="478" width="13" height="72"/>
      <rect x="476" y="478" width="13" height="72"/><rect x="503" y="478" width="13" height="72"/>
      <rect x="530" y="478" width="13" height="72"/><rect x="557" y="478" width="13" height="72"/>
      <rect x="584" y="478" width="13" height="72"/><rect x="611" y="478" width="13" height="72"/>
      <rect x="638" y="478" width="13" height="72"/><rect x="665" y="478" width="13" height="72"/>
      <rect x="692" y="478" width="13" height="72"/><rect x="719" y="478" width="13" height="72"/>
      <rect x="746" y="478" width="13" height="72"/><rect x="773" y="478" width="13" height="72"/>
      <rect x="800" y="478" width="13" height="72"/><rect x="827" y="478" width="13" height="72"/>
      <rect x="854" y="478" width="13" height="72"/><rect x="881" y="478" width="9" height="72"/>
    </g>
    <circle cx="360" cy="524" r="25" fill="#f7fafc" stroke="#b78d28" stroke-width="7"/>
    <circle cx="480" cy="524" r="25" fill="#f7fafc" stroke="#b78d28" stroke-width="7"/>
    <circle cx="600" cy="524" r="25" fill="#f7fafc" stroke="#b78d28" stroke-width="7"/>
    <circle cx="720" cy="524" r="25" fill="#f7fafc" stroke="#b78d28" stroke-width="7"/>
    <circle cx="840" cy="524" r="25" fill="#f7fafc" stroke="#b78d28" stroke-width="7"/>
    <text x="360" y="530" text-anchor="middle" class="pin-copy">0</text>
    <text x="480" y="530" text-anchor="middle" class="pin-copy">1</text>
    <text x="600" y="530" text-anchor="middle" class="pin-copy">2</text>
    <text x="720" y="530" text-anchor="middle" class="pin-copy">3V</text>
    <text x="840" y="530" text-anchor="middle" class="pin-copy">GND</text>
  </g>

  <!-- Callouts -->
  <g>
    <rect x="28" y="190" width="225" height="92" rx="16" fill="#fff" stroke="#b9d9ec" stroke-width="3"/>
    <text x="50" y="226" class="label-title">Button A</text>
    <text x="50" y="255" class="label-copy">Program input</text>
    <path class="leader" d="M253 236h65l75 75"/>
    <circle class="dot" cx="393" cy="311" r="7"/>

    <rect x="947" y="144" width="225" height="122" rx="16" fill="#fff" stroke="#b9d9ec" stroke-width="3"/>
    <text x="969" y="180" class="label-title">5 × 5 LEDs</text>
    <text x="969" y="209" class="label-copy">Show icons &amp; numbers</text>
    <text x="969" y="238" class="label-copy">and measure light</text>
    <path class="leader" d="M947 212h-97l-170 76"/>
    <circle class="dot" cx="680" cy="288" r="7"/>

    <rect x="947" y="326" width="225" height="92" rx="16" fill="#fff" stroke="#b9d9ec" stroke-width="3"/>
    <text x="969" y="362" class="label-title">Button B</text>
    <text x="969" y="391" class="label-copy">Program input</text>
    <path class="leader" d="M947 372h-66l-74-61"/>
    <circle class="dot" cx="807" cy="311" r="7"/>

    <rect x="421" y="596" width="358" height="78" rx="16" fill="#fff" stroke="#b9d9ec" stroke-width="3"/>
    <text x="600" y="628" text-anchor="middle" class="label-title">Edge connector</text>
    <text x="600" y="656" text-anchor="middle" class="label-copy">Slides into the car board</text>
    <path class="leader" d="M600 596v-57"/>
    <circle class="dot" cx="600" cy="539" r="7"/>
  </g>
</svg>
